name: Publish

# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ DO NOT RENAME THIS FILE, and do not change the job's `environment:` below.           │
# │                                                                                     │
# │ npm's trusted publisher entry for @qrocodile/api names "publish.yml" and the "npm"  │
# │ environment literally. They are how npm decides this workflow is allowed to publish. │
# │ Rename either and publishing fails with an auth error that says nothing about the    │
# │ cause — and npm's entry cannot be edited, only deleted and recreated.                │
# │                                                                                     │
# │ If you must rename: create the new trusted publisher entry on npmjs.com first, then  │
# │ rename here, then delete the old entry.                                              │
# └─────────────────────────────────────────────────────────────────────────────────────┘

# Version tags only. `pnpm version <bump>` makes the commit and the tag; `git push
# --follow-tags` (wired up as the `postversion` script) sends both, and the tag is what
# lands here.
on:
  push:
    tags:
      - 'v*'

permissions:
  # The whole basis of publishing here. npm trusts this repo and workflow rather than a
  # token, and `id-token: write` is what lets the runner mint the OIDC token that proves it.
  # It also produces the provenance attestation — proof of which commit and which run built
  # the tarball, which a laptop cannot generate and which cannot be added to a version after
  # the fact. Remove this and publishing stops working entirely.
  id-token: write
  # Write, not read: the release is created through the API at the end of this job.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag is the release's identity, package.json is what actually gets published.
      # If they disagree, the tag is a lie about what is on npm — fail before anything ships.
      - name: Check the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION."
            echo "Bump with 'pnpm version <bump>' rather than tagging by hand — it keeps the two in step."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_ENV"

      # A pre-release must not become what `npm install @qrocodile/api` resolves to. Anything
      # with a hyphen (0.2.1-beta.0) goes out under its own dist-tag instead of `latest`.
      - name: Choose the dist-tag
        run: |
          case "$version" in
            *-*) TAG="${version#*-}"; TAG="${TAG%%.*}"; PRE=true ;;
            *)   TAG="latest";                          PRE=false ;;
          esac
          echo "npm_tag=$TAG" >> "$GITHUB_ENV"
          # Same judgement, reused for the GitHub release: a pre-release must not become the
          # repo's "Latest release" any more than it becomes npm's `latest`.
          echo "prerelease=$PRE" >> "$GITHUB_ENV"
          echo "Publishing $version under dist-tag '$TAG' (prerelease: $PRE)."

      # Deliberately before the publish, not after. A version with nothing written about it
      # should stop the release while re-tagging is still possible — once it is on npm it
      # cannot be unpublished, and the release page would be the only place left to say what
      # changed. The script's error explains how to move the tag.
      - name: Take the release notes from the changelog
        run: node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/release-notes.md"

      # Already published is not a failure: it means this job was retried after succeeding.
      # But anything other than a 404 is a real error and must not be read as "not published
      # yet" — swallowing every error here is how a broken publish stays invisible.
      - name: Skip if this version is already on npm
        run: |
          if VIEW_OUT=$(npm view "@qrocodile/api@${version}" version 2>&1); then
            echo "@qrocodile/api@${version} is already published — nothing to do."
            echo "already_published=true" >> "$GITHUB_ENV"
          elif echo "$VIEW_OUT" | grep -q "E404"; then
            echo "Not yet published — proceeding."
          else
            echo "npm view failed for a reason other than the version not existing yet:"
            echo "$VIEW_OUT"
            exit 1
          fi

      # Belt and braces. `prepublishOnly` runs this same gate, but running it as its own step
      # means a failure names which check broke instead of surfacing as "publish failed".
      - run: pnpm run typecheck
        if: env.already_published != 'true'
      - run: pnpm run lint
        if: env.already_published != 'true'
      - run: pnpm run codegen:check
        if: env.already_published != 'true'
      - run: pnpm run build
        if: env.already_published != 'true'
      - run: pnpm run test
        if: env.already_published != 'true'
        env:
          QR_API_KEY: ${{ secrets.QR_API_KEY }}
          QR_API_INTEGRATION_REQUIRED: true

      # No token. npm is configured with this repo, this workflow filename and the `npm`
      # environment as a trusted publisher, so authentication is the runner's OIDC identity —
      # short-lived, bound to this workflow, and impossible to exfiltrate. Changing the
      # workflow's filename or its `environment:` breaks publishing until npm's trusted
      # publisher entry is updated to match.
      #
      # No `--provenance` either: trusted publishing generates and publishes the attestation
      # by default. Passing the flag would suggest it is what produces provenance, and
      # someone would eventually "fix" the workflow by re-adding it elsewhere.
      #
      # `--access public` is already in publishConfig and repeated here because a scoped
      # package defaulting to restricted publishes privately and silently — not a mistake
      # worth risking to save a flag.
      #
      # Requires npm >= 11.5.1 and Node >= 22.14.0; the pinned 24.19.0 ships npm 11.12.1.
      - name: Publish to npm
        if: env.already_published != 'true'
        run: npm publish --access public --tag "$npm_tag"

      # Not conditioned on `already_published`: a rerun after a publish that succeeded but
      # failed later should still be able to create a missing release. Existence is checked
      # rather than letting `gh release create` fail, so a rerun is a no-op instead of red.
      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it alone."
            echo "release_created=false" >> "$GITHUB_ENV"
          else
            if [ "$prerelease" = "true" ]; then FLAGS=--prerelease; else FLAGS=; fi
            # --verify-tag: without it a mistyped tag name is not an error, it is a brand new
            # tag created at the default branch plus a release announcing a version that does
            # not exist.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag $FLAGS
            echo "release_created=true" >> "$GITHUB_ENV"
          fi
        env:
          # Supplied to every run; no secret to configure.
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            if [ "$already_published" = "true" ]; then
              echo "### No-op — @qrocodile/api@$version was already published"
            else
              echo "### Published @qrocodile/api@$version"
              echo ""
              echo "- dist-tag: \`$npm_tag\`"
              echo "- https://www.npmjs.com/package/@qrocodile/api/v/$version"
            fi
            echo ""
            if [ "$release_created" = "true" ]; then
              echo "- release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            else
              echo "- release $GITHUB_REF_NAME already existed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
