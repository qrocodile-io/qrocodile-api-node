name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The drift check compares the committed types against the *deployed* API, so it can start
  # failing without anything in this repo changing. A push-only schedule would not notice.
  schedule:
    - cron: '17 6 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Reads .node-version, so the pin lives in one place and matches what `devEngines`
      # declares. npm enforces devEngines, and would fail loudly on a mismatch anyway.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check

      # Fails if src/openapi.d.ts no longer describes the deployed API.
      - run: pnpm run codegen:check

      # Proves the publishable bundle builds and its declarations stay self-contained.
      - run: pnpm run build

  # The tooling runs on .node-version; the tests run on every LTS line engines.node admits.
  # Odd-numbered lines are not covered. When a new LTS line ships, add it to the matrix.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5

      # The self-contained build, which ships its own Node: pnpm 11 does not start on Node 20,
      # and the consumption test runs `pnpm pack`.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Started with `node` directly, not `pnpm run test`: because of devEngines, pnpm runs
      # scripts on its own copy of .node-version's Node, which would make every cell Node 24.
      - run: node node_modules/vitest/vitest.mjs run
        env:
          QR_API_KEY: ${{ secrets.QR_API_KEY }}
          # Whether the integration suite is allowed to skip. Pull requests from forks get no
          # secrets, so requiring the key there would fail every outside contributor's first
          # PR for something they cannot fix. Everywhere else — our own PRs, pushes to main,
          # the nightly run — a missing secret has to fail rather than silently skip.
          QR_API_INTEGRATION_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
